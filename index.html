<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/dhapti-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/dhapti-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/dhapti-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dhapti University - University Management System"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Dhapti</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem("dhapti-theme") === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
          var layout = JSON.parse(localStorage.getItem("dhapti-layout-settings") || "{}");
          if (layout.themeColor) {
            var colors = {
              Default: "#16a34a",
              Brutalist: "#ef4444",
              "Soft Pop": "#a855f7",
              Tangerine: "#F68F3A",
            };
            document.documentElement.style.setProperty(
              "--portal-accent",
              colors[layout.themeColor] || "#16a34a"
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
